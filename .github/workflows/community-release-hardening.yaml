# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Community Release Hardening

on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  fast-release-package:
    name: Fast release package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache-dependency-path: |
            go.sum
      - name: Run deterministic advanced-flow verifier
        run: node examples/community-e2e/run-demo.mjs
      - name: Validate PR-050 release hardening package
        run: node hack/pr050-validate-release-hardening.mjs
      - name: Validate PR-054A timestamp expand package
        run: node hack/pr054a-validate-timestamp-expand.mjs
      - name: Run PR-054A security regression suite
        run: node hack/pr054a-validate-timestamp-expand.test.mjs
      - name: Validate timestamp expand Compose orchestration
        run: bash hack/test-server-compose-timestamp-expand.sh
      - name: Validate guarded new-volume restore orchestration
        run: bash hack/test-server-compose-restore.sh
      - name: Validate target configuration object-store environment
        run: bash hack/test-target-config-object-store-env.sh
      - name: Validate timestamp dirty recovery Compose orchestration
        shell: bash
        run: DISTR_TIMESTAMP_TEST_GROUP=dirty-recovery bash hack/test-server-compose-timestamp-expand.sh
      - name: Validate timestamp expand Compose rendering
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="$(mktemp -d)"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          chmod 0700 "$evidence_dir"
          export DISTR_COMPOSE_ENV_FILE="$PWD/deploy/server-docker-compose/.env.example"
          export DISTR_TIMESTAMP_EVIDENCE_DIR="$evidence_dir"
          [[ "$DISTR_COMPOSE_ENV_FILE" = /* ]]
          [[ "$DISTR_TIMESTAMP_EVIDENCE_DIR" = /* ]]
          docker compose --env-file "$DISTR_COMPOSE_ENV_FILE" -f deploy/server-docker-compose/docker-compose.yml --profile timestamp-operator config --quiet

  timestamp-expand-postgresql:
    name: Timestamp expand / PostgreSQL ${{ matrix.postgres_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres_version: '16.14'
            postgres_image: postgres:16.14-alpine3.23
          - postgres_version: '18.4'
            postgres_image: postgres:18.4-alpine3.23
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: local
          POSTGRES_PASSWORD: local
          POSTGRES_DB: distr
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://local:local@localhost:5432/distr?sslmode=disable
      DISTR_TEST_DATABASE_URL: postgres://local:local@localhost:5432/distr?sslmode=disable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache-dependency-path: |
            go.sum
      - name: Capture PostgreSQL runtime and image evidence
        shell: bash
        env:
          EXPECTED_POSTGRES_VERSION: ${{ matrix.postgres_version }}
          EXPECTED_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          evidence_dir="$RUNNER_TEMP/timestamp-expand-postgresql-evidence"
          evidence_file="$evidence_dir/postgresql-${EXPECTED_POSTGRES_VERSION}.txt"
          [[ "$evidence_dir" = /* ]]
          install -d -m 0700 "$evidence_dir"
          runtime_version="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U local -d distr -Atqc 'SHOW server_version')"
          configured_image="$(docker inspect --format '{{.Config.Image}}' "$POSTGRES_CONTAINER_ID")"
          image_id="$(docker inspect --format '{{.Image}}' "$POSTGRES_CONTAINER_ID")"
          repo_digest=''
          repo_digest_count=0
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^postgres@sha256:[0-9a-f]{64}$ ]]; then
              repo_digest="$candidate"
              repo_digest_count=$((repo_digest_count + 1))
            fi
          done < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_id")
          [[ "$runtime_version" == "$EXPECTED_POSTGRES_VERSION" ]]
          [[ "$configured_image" == "$EXPECTED_POSTGRES_IMAGE" ]]
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$repo_digest_count" -eq 1 ]]
          [[ "$repo_digest" =~ ^postgres@sha256:[0-9a-f]{64}$ ]]
          umask 077
          printf '%s\n' \
            "expected_server_version=$EXPECTED_POSTGRES_VERSION" \
            "runtime_server_version=$runtime_version" \
            "expected_image=$EXPECTED_POSTGRES_IMAGE" \
            "configured_image=$configured_image" \
            "image_id=$image_id" \
            "repo_digest=$repo_digest" >"$evidence_file"
          chmod 0600 "$evidence_file"
          [[ -s "$evidence_file" ]]
      - name: Validate migration sequence
        run: bash hack/validate-migrations.sh
      - name: Run timestamp expand migration and compatibility tests
        run: go test -p=1 ./internal/externalexecutiontimestamp ./internal/migrations ./internal/db ./internal/hubexecutor ./internal/mapping ./cmd/hub/cmd -count=1 -timeout 30m
      - name: Run deployment registry PostgreSQL contract tests
        run: go test -p=1 ./internal/db ./internal/handlers -run 'DeploymentRegistry|Migration139' -count=1 -timeout 15m
      - name: Retain PostgreSQL runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timestamp-expand-postgresql-${{ matrix.postgres_version }}
          path: ${{ runner.temp }}/timestamp-expand-postgresql-evidence
          if-no-files-found: error
          retention-days: 14

  release-gates:
    name: Full release gates and live demo
    needs: [fast-release-package, timestamp-expand-postgresql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_USER: local
          POSTGRES_PASSWORD: local
          POSTGRES_DB: control_plane_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://local:local@localhost:5432/control_plane_ci?sslmode=disable
      DISTR_TEST_DATABASE_URL: postgres://local:local@localhost:5432/control_plane_ci?sslmode=disable
      JWT_SECRET: bG9jYWwtand0LXNlY3JldC1wbGFjZWhvbGRlci0zMi1ieXRlcw==
      DISTR_HOST: http://localhost:8080
      USER_EMAIL_VERIFICATION_REQUIRED: 'false'
      DISTR_EXPERIMENTAL_FEATURE_FLAGS: environments,lifecycles,channels,release_bundles,deployment_processes,scoped_variables_v2,deployment_plans,task_queue,agent_capabilities,agent_task_leases,step_events,deployment_timeline,config_as_code
      DISTR_TARGET_ID: 95a53f00-a01e-414e-98fd-9e1cbf3553d9
      DISTR_TARGET_SECRET: local
      DISTR_LOGIN_ENDPOINT: http://localhost:8080/api/v1/agent/login
      DISTR_MANIFEST_ENDPOINT: http://localhost:8080/api/v1/agent/manifest
      DISTR_RESOURCE_ENDPOINT: http://localhost:8080/api/v1/agent/resources
      DISTR_STATUS_ENDPOINT: http://localhost:8080/api/v1/agent/status
      DISTR_METRICS_ENDPOINT: http://localhost:8080/api/v1/agent/metrics
      DISTR_LOGS_ENDPOINT: http://localhost:8080/api/v1/agent/logs
      DISTR_AGENT_LOGS_ENDPOINT: http://localhost:8080/api/v1/agent/deployment-target-logs
      DISTR_INTERVAL: 5s
      DISTR_REGISTRY_HOST: localhost:8585
      DISTR_DEMO_DISPOSABLE_HUB: 'true'
    steps:
      - name: Assert prerequisite jobs succeeded
        env:
          FAST_RELEASE_RESULT: ${{ needs.fast-release-package.result }}
          TIMESTAMP_POSTGRES_RESULT: ${{ needs.timestamp-expand-postgresql.result }}
        run: |
          set -Eeuo pipefail
          [[ "$FAST_RELEASE_RESULT" == success ]]
          [[ "$TIMESTAMP_POSTGRES_RESULT" == success ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Install cosign for signed provenance
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run adopter-term scanner and operator guide gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          test -s docs/api/operator-control-plane-api.md
          node --test hack/control-plane-adopter-term-scan.test.mjs
          case "$EVENT_NAME" in
            pull_request) scan_base="$PULL_REQUEST_BASE_SHA" ;;
            push) scan_base="$PUSH_BEFORE_SHA" ;;
            *) exit 2 ;;
          esac
          [[ "$scan_base" =~ ^[0-9a-f]{40}$ ]]
          node hack/control-plane-adopter-term-scan.mjs --base "$scan_base"
      - name: Check committed patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PULL_REQUEST_BASE_SHA"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
                empty_tree="$(git hash-object -t tree /dev/null)"
                [[ "$empty_tree" =~ ^[0-9a-f]{40}$ ]]
                git diff --check "$empty_tree" HEAD
                exit 0
              else
                base="$PUSH_BEFORE_SHA"
              fi
              ;;
            *)
              printf 'unsupported event for release diff check\n' >&2
              exit 1
              ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$base"
          fi
          git cat-file -e "${base}^{commit}"
          git diff --check "$base" HEAD
      - name: Scan committed secrets and privacy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          scan_dir="$(mktemp -d)"
          trap 'rm -rf -- "$scan_dir"' EXIT
          chmod 0700 "$scan_dir"
          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$head_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXECUTION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_commit" == "$EXECUTION_SHA" ]]

          case "$EVENT_NAME" in
            pull_request)
              base_object="$PULL_REQUEST_BASE_SHA"
              [[ "$PULL_REQUEST_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "${PULL_REQUEST_HEAD_SHA}^{commit}"
              git merge-base --is-ancestor "$PULL_REQUEST_HEAD_SHA" "$head_commit"
              gitleaks_log_opts="--full-history --root --diff-merges=separate --no-ext-diff --no-textconv $base_object..$head_commit"
              ;;
            push)
              if [[ "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
                base_object="$(git hash-object -t tree /dev/null)"
                gitleaks_log_opts="--full-history --root --diff-merges=separate --no-ext-diff --no-textconv $head_commit"
              else
                base_object="$PUSH_BEFORE_SHA"
                gitleaks_log_opts="--full-history --root --diff-merges=separate --no-ext-diff --no-textconv $base_object..$head_commit"
              fi
              ;;
            *)
              printf 'unsupported event for privacy scan\n' >&2
              exit 1
              ;;
          esac
          [[ "$base_object" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_commit" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${base_object}^{object}"
          git cat-file -e "${head_commit}^{commit}"

          GITLEAKS_VERSION='8.30.1'
          GITLEAKS_SHA256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          [[ "$(uname -s)" == Linux ]]
          [[ "$(uname -m)" == x86_64 ]]
          gitleaks_archive="$scan_dir/gitleaks.tar.gz"
          gitleaks_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$gitleaks_url" --output "$gitleaks_archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$gitleaks_archive" | sha256sum --check --status
          tar -xzf "$gitleaks_archive" -C "$scan_dir" gitleaks
          chmod 0700 "$scan_dir/gitleaks"
          [[ "$("$scan_dir/gitleaks" version)" == "$GITLEAKS_VERSION" ]]

          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          gitleaks_config="$scan_dir/default-gitleaks.toml"
          gitleaks_ignore="$scan_dir/empty-gitleaks-ignore"
          gitleaks_stdout="$scan_dir/gitleaks.stdout"
          gitleaks_stderr="$scan_dir/gitleaks.stderr"
          printf '[extend]\nuseDefault = true\n' >"$gitleaks_config"
          : >"$gitleaks_ignore"
          : >"$gitleaks_stdout"
          : >"$gitleaks_stderr"
          chmod 0600 "$gitleaks_config" "$gitleaks_ignore"
          chmod 0600 "$gitleaks_stdout" "$gitleaks_stderr"

          set +e
          "$scan_dir/gitleaks" git \
            --no-banner \
            --redact=100 \
            --config "$gitleaks_config" \
            --gitleaks-ignore-path "$gitleaks_ignore" \
            --ignore-gitleaks-allow \
            --log-opts="$gitleaks_log_opts" \
            "$GITHUB_WORKSPACE" >"$gitleaks_stdout" 2>"$gitleaks_stderr"
          gitleaks_status=$?
          set -e
          case "$gitleaks_status" in
            0) ;;
            1)
              printf 'default secret scan detected findings\n' >&2
              exit 1
              ;;
            *)
              printf 'default secret scan failed closed\n' >&2
              exit 1
              ;;
          esac

          set +e
          node hack/pr054a-validate-timestamp-expand.mjs --scan-privacy-diff "$base_object" "$head_commit"
          privacy_status=$?
          set -e
          case "$privacy_status" in
            0) ;;
            *)
              printf 'semantic privacy scan failed closed\n' >&2
              exit 1
              ;;
          esac
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache-dependency-path: |
            go.sum
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint with prettier
        run: pnpm run lint
      - name: Validate migrations
        run: hack/validate-migrations.sh
      - name: Run Go tests
        env:
          DISTR_TEST_DATABASE_URL: postgres://local:local@localhost:5432/distr?sslmode=disable
        run: go test -p=1 ./... -count=1 -timeout 60m
      - name: Run Go static analysis
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: 'v2.12.2' # renovate: datasource=github-releases depName=golangci/golangci-lint
          args: --config=.golangci.release.yml ./...
      - name: Run Angular tests
        run: pnpm run test
      - name: Build community frontend
        run: pnpm run build:community
      - name: Build community Hub
        run: go build -o dist/distr-amd64 ./cmd/hub
      - name: Build Docker agent
        run: go build -o dist/docker-agent ./cmd/agent/docker
      - name: Build Kubernetes agent
        run: go build -o dist/kubernetes-agent ./cmd/agent/kubernetes
      - name: Build release evidence image once
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir=dist/release-evidence
          install -d -m 0700 "$evidence_dir"
          binary_sha="$(sha256sum dist/distr-amd64 | awk '{print $1}')"
          [[ "$binary_sha" =~ ^[0-9a-f]{64}$ ]]
          BINARY_SHA="$binary_sha" node - <<'NODE'
          const fs = require('node:fs');
          const commit = process.env.GITHUB_SHA;
          const document = {
            spdxVersion: 'SPDX-2.3',
            dataLicense: 'CC0-1.0',
            SPDXID: 'SPDXRef-DOCUMENT',
            name: `distr-hub-content-${commit}`,
            documentNamespace: `https://distr.sh/spdx/hub/${commit}`,
            creationInfo: {
              created: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
              creators: ['Tool: community-release-hardening'],
            },
            documentDescribes: ['SPDXRef-Package-distr-hub'],
            packages: [{
              name: 'distr-hub',
              SPDXID: 'SPDXRef-Package-distr-hub',
              versionInfo: commit,
              downloadLocation: 'NOASSERTION',
              filesAnalyzed: true,
            }],
            files: [{
              fileName: '/distr',
              SPDXID: 'SPDXRef-File-distr',
              checksums: [{algorithm: 'SHA256', checksumValue: process.env.BINARY_SHA}],
            }],
            relationships: [{
              spdxElementId: 'SPDXRef-Package-distr-hub',
              relationshipType: 'CONTAINS',
              relatedSpdxElement: 'SPDXRef-File-distr',
            }],
          };
          fs.writeFileSync('dist/hub-content.spdx.json', `${JSON.stringify(document, null, 2)}\n`, {mode: 0o600});
          NODE
          docker build \
            --build-arg TARGETARCH=amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --file Dockerfile.hub \
            --tag "distr-control-plane-release:${GITHUB_SHA}" \
            .
          image_id="$(docker image inspect --format='{{.Id}}' "distr-control-plane-release:${GITHUB_SHA}")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$image_id" >"$evidence_dir/image-id.txt"
      - name: Generate real image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: distr-control-plane-release:${{ github.sha }}
          output-file: dist/release-evidence/image.spdx.json
          artifact-name: control-plane-release.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate SBOM and emit signed digest-bound provenance attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const sbom = JSON.parse(fs.readFileSync('dist/release-evidence/image.spdx.json', 'utf8'));
          if (
            sbom.spdxVersion !== 'SPDX-2.3' ||
            sbom.SPDXID !== 'SPDXRef-DOCUMENT' ||
            !Array.isArray(sbom.documentDescribes) ||
            sbom.documentDescribes.length === 0 ||
            !Array.isArray(sbom.packages) ||
            sbom.packages.length === 0
          ) {
            throw new Error('release SBOM must describe at least one image package');
          }
          const imageId = fs.readFileSync('dist/release-evidence/image-id.txt', 'utf8').trim();
          if (!/^sha256:[0-9a-f]{64}$/.test(imageId)) throw new Error('invalid immutable image ID');
          const commit = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('invalid source commit');
          const source = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const statement = {
            _type: 'https://in-toto.io/Statement/v1',
            subject: [{
              name: `distr-control-plane-release:${commit}`,
              digest: {sha256: imageId.slice('sha256:'.length)},
            }],
            predicateType: 'https://slsa.dev/provenance/v1',
            predicate: {
              buildDefinition: {
                buildType: 'https://distr.sh/build-types/community-hub-image/v1',
                externalParameters: {platform: 'linux/amd64'},
                internalParameters: {},
                resolvedDependencies: [{uri: source, digest: {sha1: commit}}],
              },
              runDetails: {
                builder: {id: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`},
                metadata: {invocationId: `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`},
              },
            },
          };
          fs.writeFileSync(
            'dist/release-evidence/provenance.intoto.json',
            `${JSON.stringify(statement, null, 2)}\n`,
            {mode: 0o600}
          );
          NODE
          (
            cd dist/release-evidence
            sha256sum image.spdx.json >image.spdx.json.sha256
            sha256sum provenance.intoto.json >provenance.intoto.json.sha256
            sha256sum -c --status image.spdx.json.sha256
            sha256sum -c --status provenance.intoto.json.sha256
          )
          provenance=dist/release-evidence/provenance.intoto.json
          bundle=dist/release-evidence/provenance.sigstore.json
          certificate_identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/community-release-hardening.yaml@${GITHUB_REF}"
          cosign sign-blob --yes --bundle "$bundle" "$provenance"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$provenance"
          (
            cd dist/release-evidence
            sha256sum provenance.sigstore.json >provenance.sigstore.json.sha256
            sha256sum -c --status provenance.sigstore.json.sha256
          )
      - name: Run executable control-plane migration matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          install -d -m 0700 work/release-evidence dist/release-evidence
          pwsh -NoLogo -NoProfile -NonInteractive \
            -File hack/control-plane-migration-matrix.ps1 \
            -DatabaseUrl "$DATABASE_URL" \
            -ExpectedPostgresVersion '18.4' \
            -OutputPath 'work/release-evidence/migration-postgresql-18.4.json'
          node hack/pr050-validate-control-plane-evidence.mjs migration \
            work/release-evidence/migration-postgresql-18.4.json \
            "$GITHUB_SHA" \
            '18.4'
          install -m 0600 \
            work/release-evidence/migration-postgresql-18.4.json \
            dist/release-evidence/migration-postgresql-18.4.json

          database_container="distr-release-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database_credential="$(openssl rand -hex 24)"
          cleanup_database() {
            docker rm -f "$database_container" >/dev/null 2>&1 || true
            database_credential=''
          }
          trap cleanup_database EXIT HUP INT TERM
          docker run --detach \
            --name "$database_container" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=release_ci \
            --env POSTGRES_PASSWORD="$database_credential" \
            --env POSTGRES_DB=control_plane_ci \
            postgres:16.14-alpine3.23 >/dev/null
          database_port="$(docker port "$database_container" 5432/tcp | sed -n 's/.*://p')"
          [[ "$database_port" =~ ^[0-9]+$ ]]
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$database_container" pg_isready -U release_ci -d control_plane_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          [[ "$ready" -eq 1 ]]
          database_url="postgres://release_ci:${database_credential}@127.0.0.1:${database_port}/control_plane_ci?sslmode=disable"
          pwsh -NoLogo -NoProfile -NonInteractive \
            -File hack/control-plane-migration-matrix.ps1 \
            -DatabaseUrl "$database_url" \
            -ExpectedPostgresVersion '16.14' \
            -OutputPath 'work/release-evidence/migration-postgresql-16.14.json'
          database_url=''
          node hack/pr050-validate-control-plane-evidence.mjs migration \
            work/release-evidence/migration-postgresql-16.14.json \
            "$GITHUB_SHA" \
            '16.14'
          install -m 0600 \
            work/release-evidence/migration-postgresql-16.14.json \
            dist/release-evidence/migration-postgresql-16.14.json
          cleanup_database
          trap - EXIT HUP INT TERM
      - name: Run control-plane UI acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_ui_report="$RUNNER_TEMP/control-plane-ui-report.json"
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test \
            --config playwright.control-plane.config.ts \
            --reporter=json >"$raw_ui_report"
          node - "$raw_ui_report" <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (
            !Number.isInteger(raw.stats?.expected) ||
            raw.stats.expected < 1 ||
            raw.stats.unexpected !== 0 ||
            raw.stats.flaky !== 0
          ) {
            throw new Error('UI report must contain passing non-flaky Playwright results');
          }
          const report = {
            schemaVersion: 'distr.control-plane-ui-report/v1',
            status: 'PASS',
            stats: {
              expected: raw.stats.expected,
              unexpected: raw.stats.unexpected,
              flaky: raw.stats.flaky,
              skipped: Number.isInteger(raw.stats.skipped) ? raw.stats.skipped : 0,
            },
          };
          fs.writeFileSync(
            'dist/release-evidence/ui.json',
            `${JSON.stringify(report, null, 2)}\n`,
            {mode: 0o600}
          );
          NODE
          node hack/pr050-validate-control-plane-evidence.mjs ui dist/release-evidence/ui.json
      - name: Run post-deploy operator and API acceptance
        shell: bash
        env:
          DISTR_CP_HUB_IMAGE: distr-control-plane-release:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node examples/control-plane-e2e/run.mjs --mode clean --json >dist/release-evidence/post-deploy.json
          node hack/pr050-validate-control-plane-evidence.mjs postdeploy dist/release-evidence/post-deploy.json
      - name: Assemble checksummed five-domain acceptance bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          node hack/pr050-validate-control-plane-evidence.mjs migration \
            dist/release-evidence/migration-postgresql-16.14.json \
            "$GITHUB_SHA" \
            '16.14'
          node hack/pr050-validate-control-plane-evidence.mjs migration \
            dist/release-evidence/migration-postgresql-18.4.json \
            "$GITHUB_SHA" \
            '18.4'
          node hack/pr050-validate-control-plane-evidence.mjs postdeploy dist/release-evidence/post-deploy.json
          node hack/pr050-validate-control-plane-evidence.mjs ui dist/release-evidence/ui.json
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const directory = 'dist/release-evidence';
          const checksum = (name) =>
            `sha256:${crypto.createHash('sha256').update(fs.readFileSync(`${directory}/${name}`)).digest('hex')}`;
          const live = (selector) => ({
            status: 'PASS',
            reference: 'post-deploy.json',
            sha256: checksum('post-deploy.json'),
            selector,
          });
          const matrix = (postgresVersion) => {
            const reference = `migration-postgresql-${postgresVersion}.json`;
            return {
              status: 'PASS',
              postgresVersion,
              reference,
              sha256: checksum(reference),
              selectors: [
                'range=138..166',
                'v1-flags-off=PASS',
                'mixed-v1-v2=PASS',
                'v2-history-flags-off=PASS',
              ],
            };
          };
          const bundle = {
            schemaVersion: 'distr.control-plane-release-acceptance/v1',
            status: 'PASS',
            sourceCommit: process.env.GITHUB_SHA,
            imageId: fs.readFileSync(`${directory}/image-id.txt`, 'utf8').trim(),
            sbom: {reference: 'image.spdx.json', sha256: checksum('image.spdx.json')},
            provenance: {
              status: 'PASS',
              reference: 'provenance.intoto.json',
              sha256: checksum('provenance.intoto.json'),
              signatureReference: 'provenance.sigstore.json',
              signatureSha256: checksum('provenance.sigstore.json'),
              verification: 'cosign verify-blob',
            },
            migrations: [matrix('16.14'), matrix('18.4')],
            evidence: {
              operator: live('liveStack.started=true,loopbackOnly=true,required services present,cleanup complete'),
              api: live('proofMode=live-hub-api,targets>=2,v2 migration attempts succeeded'),
              ui: {
                status: 'PASS',
                reference: 'ui.json',
                sha256: checksum('ui.json'),
                selector: 'stats.expected>0,unexpected=0,flaky=0',
              },
              flag: {
                status: 'PASS',
                references: [
                  'migration-postgresql-16.14.json',
                  'migration-postgresql-18.4.json',
                ],
                sha256: [
                  checksum('migration-postgresql-16.14.json'),
                  checksum('migration-postgresql-18.4.json'),
                ],
                selector: 'v1-flags-off,mixed-v1-v2,v2-history-flags-off all PASS on PostgreSQL 16.14 and 18.4',
              },
              audit: live('trusted current ACCEPTED observer evidence,A-B-A reconciliation,fleet rows,verified flowChecksum'),
            },
          };
          fs.writeFileSync(
            `${directory}/acceptance.json`,
            `${JSON.stringify(bundle, null, 2)}\n`,
            {mode: 0o600}
          );
          NODE
          (
            cd dist/release-evidence
            sha256sum migration-postgresql-16.14.json >migration-postgresql-16.14.json.sha256
            sha256sum migration-postgresql-18.4.json >migration-postgresql-18.4.json.sha256
            sha256sum post-deploy.json >post-deploy.json.sha256
            sha256sum ui.json >ui.json.sha256
            sha256sum acceptance.json >acceptance.json.sha256
            sha256sum -c --status migration-postgresql-16.14.json.sha256
            sha256sum -c --status migration-postgresql-18.4.json.sha256
            sha256sum -c --status post-deploy.json.sha256
            sha256sum -c --status ui.json.sha256
            sha256sum -c --status acceptance.json.sha256
          )
      - name: Start Hub and run live community demo
        shell: bash
        run: |
          dist/distr-amd64 serve &
          node examples/community-e2e/live-demo.mjs --require-running-hub
      - name: Run Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          node hack/pr050-govulncheck.mjs
      - name: Run production dependency audit
        run: pnpm audit --prod
      - name: Run dependency license scan
        run: node hack/pr050-license-scan.mjs
      - name: Run PR-050 release package validation
        run: node hack/pr050-validate-release-hardening.mjs
      - name: Retain enforced release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-release-evidence-${{ github.sha }}
          path: |
            dist/release-evidence
            work/release-evidence
          if-no-files-found: error
          retention-days: 30
